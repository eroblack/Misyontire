<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eroblack Mission 100</title>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; overflow: hidden; touch-action: none; text-align: center; }
        canvas { display: block; background: #050505; }
        #ui-top { position: absolute; top: 10px; width: 100%; display: flex; justify-content: space-around; z-index: 10; pointer-events: none; }
        .stat-box { background: rgba(255,255,255,0.1); padding: 8px; border-radius: 10px; border: 1px solid #333; min-width: 80px; }
        .label { font-size: 10px; color: #888; display: block; text-transform: uppercase; }
        .val { font-size: 18px; font-weight: bold; color: #0f0; }
        
        #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .card { width: 85%; background: #1a1a1a; border: 2px solid #f00; border-radius: 20px; padding: 25px; box-shadow: 0 0 20px rgba(255,0,0,0.3); }
        input { width: 90%; padding: 15px; margin: 15px 0; background: #000; border: 1px solid #444; color: #fff; text-align: center; font-size: 24px; border-radius: 10px; outline: none; }
        button { width: 100%; padding: 18px; border-radius: 12px; border: none; font-weight: bold; font-size: 20px; cursor: pointer; background: #f00; color: #fff; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="ui-top">
        <div class="stat-box"><span class="label">Touye</span><span id="score">0</span>/100</div>
        <div class="stat-box"><span class="label">Rete</span><span id="remain">125</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="modal">
        <div class="card" id="modal-content">
            <h2 style="color:#f00; margin-top:0;">MISYON 100</h2>
            <p>Touye 100 avion pou fè 10 fwa miz ou!</p>
            <label style="font-size:12px; color:#aaa;">ANTRE MIZ OU (HTG)</label>
            <input type="number" id="miz-input" value="10">
            <button onclick="startGame()">KÒMANSE JWE</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let score = 0;
    let enemiesCreated = 0;
    let enemiesFinished = 0;
    let gameActive = false;
    let mizFinal = 0;
    const TOTAL_ENEMIES = 125;
    const TARGET = 100;

    const player = { x: canvas.width/2 - 25, y: canvas.height - 120, w: 50, h: 50 };
    const bullets = [];
    const enemies = [];

    function sendToApp(bwat, val) {
        if (window.Android) { window.Android.voyeKòb(bwat, val.toString()); }
        console.log(bwat + " : " + val);
    }

    function startGame() {
        mizFinal = document.getElementById('miz-input').value;
        if(mizFinal <= 0) { alert("Mete yon miz!"); return; }
        
        sendToApp("peye", mizFinal);
        sendToApp("genyen", "0");

        document.getElementById('modal').style.display = "none";
        gameActive = true;
        
        // Kòmanse voye lènmi yo
        spawnEnemy();
    }

    function spawnEnemy() {
        if (!gameActive || enemiesCreated >= TOTAL_ENEMIES) return;

        enemies.push({
            x: Math.random() * (canvas.width - 45),
            y: -50,
            w: 45,
            h: 40,
            hp: 10,
            speed: 1.5 + (Math.random() * 2) 
        });

        enemiesCreated++;
        document.getElementById('remain').innerText = (TOTAL_ENEMIES - enemiesCreated);

        // Tan ant chak lènmi (1 segonn)
        setTimeout(spawnEnemy, 1000);
    }

    // Tirer otomatik
    setInterval(() => {
        if (gameActive) {
            bullets.push({ x: player.x + 22, y: player.y, w: 6, h: 15, speed: 12 });
        }
    }, 180);

    // Kontwòl ak dwèt
    window.addEventListener("touchmove", (e) => {
        if(!gameActive) return;
        player.x = e.touches[0].clientX - 25;
        player.y = e.touches[0].clientY - 25;
        e.preventDefault();
    }, {passive: false});

    function update() {
        if (!gameActive) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Player (Veso a)
        ctx.fillStyle = "#f00";
        ctx.fillRect(player.x, player.y, player.w, player.h);
        ctx.strokeStyle = "#fff";
        ctx.strokeRect(player.x, player.y, player.w, player.h);

        // Bal yo
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.y -= b.speed;
            ctx.fillStyle = "#0ff";
            ctx.fillRect(b.x, b.y, b.w, b.h);
            if (b.y < 0) bullets.splice(i, 1);
        }

        // Lènmi yo (Avion yo)
        for (let i = enemies.length - 1; i >= 0; i--) {
            let en = enemies[i];
            en.y += en.speed;
            
            // Desen Avion
            ctx.fillStyle = "#333";
            ctx.fillRect(en.x, en.y, en.w, en.h);
            ctx.strokeStyle = "#ff0";
            ctx.strokeRect(en.x, en.y, en.w, en.h);
            
            // HP
            ctx.fillStyle = "#fff";
            ctx.font = "bold 14px Arial";
            ctx.textAlign = "center";
            ctx.fillText(en.hp, en.x + en.w/2, en.y + 25);

            // Collision Bal ak Avion
            for (let j = bullets.length - 1; j >= 0; j--) {
                let b = bullets[j];
                if (b.x < en.x + en.w && b.x + b.w > en.x && b.y < en.y + en.h && b.y + b.h > en.y) {
                    en.hp--;
                    bullets.splice(j, 1);
                    if (en.hp <= 0) {
                        enemies.splice(i, 1);
                        score++;
                        enemiesFinished++;
                        document.getElementById('score').innerText = score;
                        checkFinish();
                    }
                    break;
                }
            }

            // Si avion an depase ekran an
            if (en && en.y > canvas.height) {
                enemies.splice(i, 1);
                enemiesFinished++;
                checkFinish();
            }

            // Si player touche avion
            if (en && player.x < en.x + en.w && player.x + player.w > en.x && player.y < en.y + en.h && player.y + player.h > en.y) {
                gameOver();
            }
        }
        requestAnimationFrame(update);
    }

    function checkFinish() {
        if (enemiesFinished >= TOTAL_ENEMIES) {
            gameOver();
        }
    }

    function gameOver() {
        gameActive = false;
        let won = score >= TARGET;
        let gain = won ? (mizFinal * 10) : 0;

        sendToApp("genyen", gain);

        document.getElementById('modal').style.display = "flex";
        document.getElementById('modal-content').innerHTML = `
            <h1 style="color:${won ? '#0f0' : '#f00'}; font-size:40px;">${won ? 'VIKTWA!' : 'OU PÈDI'}</h1>
            <p style="font-size:20px;">Ou touye: <b style="color:#0f0">${score}</b>/125</p>
            <h2 style="background:#000; padding:15px; border-radius:10px;">Ganyen: ${gain} HTG</h2>
            <button onclick="location.reload()" style="margin-top:10px;">REKÒMANSE</button>
        `;
    }

    update();
</script>
</body>
</html>
