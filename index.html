<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eroblack Mission 100</title>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; overflow: hidden; touch-action: none; text-align: center; }
        canvas { display: block; background: radial-gradient(circle, #111, #000); }
        #ui-top { position: absolute; top: 10px; width: 100%; display: flex; justify-content: space-around; z-index: 10; pointer-events: none; }
        .stat-box { background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 10px; border: 1px solid #333; }
        .label { font-size: 10px; color: #888; display: block; }
        .val { font-size: 18px; font-weight: bold; color: #0f0; }
        
        #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .card { width: 85%; background: #1a1a1a; border: 2px solid #f00; border-radius: 20px; padding: 25px; }
        input { width: 80%; padding: 12px; margin: 15px 0; background: #000; border: 1px solid #444; color: #fff; text-align: center; font-size: 20px; border-radius: 10px; }
        button { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: bold; font-size: 18px; cursor: pointer; background: #f00; color: #fff; }
    </style>
</head>
<body>

    <div id="ui-top">
        <div class="stat-box"><span class="label">TOUYE</span><span id="score" class="val">0</span>/100</div>
        <div class="stat-box"><span class="label">LÈNMI KI PASE</span><span id="count" class="val">0</span>/125</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="modal">
        <div class="card" id="modal-content">
            <h2>MISYON 100</h2>
            <p>Mize pou w genyen 10 fwa plis!</p>
            <input type="number" id="miz-input" placeholder="Antre Miz" value="10">
            <button onclick="prepareStart()">KOMANSE</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let score = 0;
    let enemiesPassed = 0;
    let gameActive = false;
    let mizFinal = 0;
    const TOTAL_ENEMIES = 125;
    const TARGET = 100;

    const player = { x: canvas.width/2 - 25, y: canvas.height - 100, w: 50, h: 50 };
    const bullets = [];
    const enemies = [];

    // --- INTERFACE AK SKETCHWARE ---
    function sendToApp(bwat, val) {
        if (window.Android) { window.Android.voyeKòb(bwat, val.toString()); }
    }

    function prepareStart() {
        mizFinal = document.getElementById('miz-input').value;
        if(mizFinal <= 0) return;
        
        // Ranpli bwat PEYE nan Sketchware
        sendToApp("peye", mizFinal);
        sendToApp("genyen", "0");

        document.getElementById('modal').style.display = "none";
        gameActive = true;
        spawnLoop();
    }

    function spawnLoop() {
        if (!gameActive || enemiesPassed >= TOTAL_ENEMIES) return;
        enemies.push({
            x: Math.random() * (canvas.width - 40),
            y: -50, w: 40, h: 40, hp: 10,
            speed: 2 + Math.random() * 2
        });
        enemiesPassed++;
        document.getElementById('count').innerText = enemiesPassed;
        
        let nextSpawn = (enemiesPassed >= TOTAL_ENEMIES) ? 999999 : 1000;
        setTimeout(spawnLoop, nextSpawn);
    }

    setInterval(() => {
        if (gameActive) bullets.push({ x: player.x + 22, y: player.y, w: 6, h: 15, speed: 10 });
    }, 200);

    window.addEventListener("touchmove", (e) => {
        player.x = e.touches[0].clientX - 25;
        player.y = e.touches[0].clientY - 25;
    });

    function update() {
        if (!gameActive) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Player
        ctx.fillStyle = "#f00";
        ctx.fillRect(player.x, player.y, player.w, player.h);

        // Bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.y -= b.speed;
            ctx.fillStyle = "#0ff";
            ctx.fillRect(b.x, b.y, b.w, b.h);
            if (b.y < 0) bullets.splice(i, 1);
        }

        // Enemies
        for (let i = enemies.length - 1; i >= 0; i--) {
            let en = enemies[i];
            en.y += en.speed;
            
            ctx.fillStyle = "#333";
            ctx.strokeStyle = "#fff";
            ctx.strokeRect(en.x, en.y, en.w, en.h);
            ctx.fillRect(en.x, en.y, en.w, en.h);
            
            ctx.fillStyle = "#fff";
            ctx.font = "12px Arial";
            ctx.textAlign = "center";
            ctx.fillText(en.hp, en.x + 20, en.y + 25);

            // Collision Bullet/Enemy
            for (let j = bullets.length - 1; j >= 0; j--) {
                let b = bullets[j];
                if (b.x < en.x + en.w && b.x + b.w > en.x && b.y < en.y + en.h && b.y + b.h > en.y) {
                    en.hp--;
                    bullets.splice(j, 1);
                    if (en.hp <= 0) {
                        enemies.splice(i, 1);
                        score++;
                        document.getElementById('score').innerText = score;
                    }
                    break;
                }
            }

            // Si player touche lènmi
            if (en && player.x < en.x + en.w && player.x + player.w > en.x && player.y < en.y + en.h && player.y + player.h > en.y) {
                endGame();
            }

            if (en.y > canvas.height) {
                enemies.splice(i, 1);
                checkFinish();
            }
        }
        requestAnimationFrame(update);
    }

    function checkFinish() {
        if (enemiesPassed >= TOTAL_ENEMIES && enemies.length === 0) {
            endGame();
        }
    }

    function endGame() {
        gameActive = false;
        let won = score >= TARGET;
        let gain = won ? (mizFinal * 10) : 0;

        // Ranpli bwat GENYEN nan Sketchware
        sendToApp("genyen", gain);

        document.getElementById('modal').style.display = "flex";
        document.getElementById('modal-content').innerHTML = `
            <h1 style="color:${won ? '#0f0' : '#f00'}">${won ? 'VIKTWA!' : 'OU PÈDI'}</h1>
            <p>Ou touye: ${score} lènmi</p>
            <h2>Ganyen: ${gain} HTG</h2>
            <button onclick="location.reload()">REKÒMANSE</button>
        `;
    }

    update();
</script>
</body>
</html>
